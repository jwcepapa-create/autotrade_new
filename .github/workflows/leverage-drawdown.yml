name: Leverage drawdown ETF research
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "End date YYYY-MM-DD (must be a completed US trading session)"
        required: true
        type: string
        default: "2026-11-11"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_leverage_drawdown.py tests/test_leverage_v2.py tests/test_leverage_v3.py
      - name: Run real-data leverage research
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          END_DATE: ${{ inputs.end_date }}
        run: python leverage_drawdown.py --end "$END_DATE"
      - name: Upload research outputs, including diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leverage-drawdown-${{ github.run_id }}
          path: leverage_results/
          if-no-files-found: warn
