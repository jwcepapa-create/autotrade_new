name: Tiingo research backtest
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh full history (corporate actions are also detected automatically)
        type: boolean
        default: false
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    branches: ['feat/tiingo-backtest', 'research/strategy-lab']
permissions:
  contents: read
concurrency:
  group: tiingo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - uses: actions/cache@v4
        with:
          path: data
          key: tiingo-eod-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tiingo-eod-v1-${{ github.ref_name }}-
            tiingo-eod-v1-main-
      - name: Verify actual Tiingo access and historical coverage
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          REFRESH: ${{ inputs.refresh }}
        shell: bash
        run: |
          args=()
          if [[ "$REFRESH" == 'true' ]]; then args+=(--refresh); fi
          python tiingo_data.py --probe-intraday "${args[@]}"
      - name: Portfolio backtest (validated local CSV only)
        run: python run_backtest.py
      - name: Strategy B v0.3 breakout backtest (research only)
        if: github.ref_name == 'research/support-resistance' || github.ref_name == 'research/strategy-lab'
        run: python research_mts_v03.py
      - name: Compare repeated vs edge-triggered exits (research only)
        if: github.ref_name == 'research/support-resistance'
        run: python research_exit_comparison.py
      - name: Research lab baseline parity B knobs and C D E backtests
        if: github.ref_name == 'research/strategy-lab'
        run: python research_strategy_lab.py
      - name: Chronological B walk-forward research
        if: github.ref_name == 'research/strategy-lab'
        run: python research_b_walkforward.py
      - name: Common-capital portfolio benchmark and monthly rebalance
        if: github.ref_name == 'research/strategy-lab'
        run: python research_portfolio.py
      - name: True buy-hold versus crash-defense overlay stress research
        if: github.ref_name == 'research/strategy-lab'
        run: python research_defense_overlay.py
      - name: ETF dotcom and global financial crisis historical stress
        if: github.ref_name == 'research/strategy-lab'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python research_historical_etf.py
      - name: Save data and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiingo-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*.csv
            results/
          if-no-files-found: warn
          retention-days: 14
