name: Telegram backtest result notification

on:
  workflow_run:
    workflows: ["Tiingo research backtest", "Leverage drawdown ETF research"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    # Report all manually requested backtests and scheduled failures only.
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download completed run artifacts
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: '*'
          path: downloaded-results
          merge-multiple: true
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPOSITORY: ${{ github.repository }}
          SUMMARY_FILE: downloaded-results/results/summary.json
          LEVERAGE_SUMMARY_FILE: downloaded-results/leverage_results/summary.json
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are not configured")
          status = os.environ.get("RUN_CONCLUSION", "unknown")
          icon = "✅" if status == "success" else "❌" if status == "failure" else "ℹ️"
          message = (
              f"{icon} Autotrade_new {os.environ.get('WORKFLOW_NAME', '백테스트')} {status}\n"
              f"브랜치: {os.environ.get('RUN_BRANCH', '')[:100]}\n"
              f"실행 유형: {os.environ.get('RUN_EVENT', '')[:40]}\n"
          )

          # Use actions/download-artifact rather than a raw archive API request.
          # Only a completed summary.json from the exact triggering run is eligible.
          if status == "success":
              from pathlib import Path

              is_leverage = os.environ.get("WORKFLOW_NAME") == "Leverage drawdown ETF research"
              root = Path("downloaded-results")
              candidates = sorted(root.rglob("summary.json")) if root.is_dir() else []
              if is_leverage:
                  # actions/download-artifact may strip the uploaded root directory.
                  candidates = [p for p in candidates if "results" not in p.parts]
              else:
                  candidates = [p for p in candidates if "leverage_results" not in p.parts]
              path = candidates[0] if len(candidates) == 1 else root / "__missing_summary__.json"
              try:
                  if not path.is_file():
                      raise FileNotFoundError("summary.json missing from downloaded artifact")
                  summary = json.loads(path.read_text(encoding="utf-8"))
                  if summary.get("status") != "completed":
                      raise ValueError("Backtest status is not completed")
                  if is_leverage:
                      strategies = summary["strategies"]
                      message += f"기간: {summary['strategies']['drawdown_original']['start']} ~ {summary['strategies']['drawdown_original']['end']}\n"
                      for key, label in [
                          ("drawdown_original", "레버리지 원안"),
                          ("drawdown_risk_managed", "위험관리형"),
                          ("base_1x_only", "1배 ETF"),
                          ("qqq_buy_hold", "QQQ B&H"),
                      ]:
                          m = strategies[key]
                          message += (
                              f"{label}: CAGR {float(m['cagr'])*100:+.2f}%, "
                              f"MDD {float(m['mdd'])*100:.2f}%, "
                              f"총수익 {float(m['total_return'])*100:+.2f}%\n"
                          )
                      message += "주의: 실제 ETF 가격 기반 연구, 실거래 아님\n"
                  else:
                      metrics = summary["metrics"]
                      swing = metrics["swing"]
                      hold = metrics["qqq_buy_hold"]
                      config = summary["config"]

                      def pct(value):
                          return "N/A" if value is None else f"{float(value) * 100:+.2f}%"

                      def num(value):
                          return "N/A" if value is None else f"{float(value):.2f}"

                      message += (
                          f"검증 기간: {config['start']} ~ {config['end']}\n"
                          f"전략 수익률: {pct(swing['total_return'])}\n"
                          f"전략 CAGR: {pct(swing['cagr'])}\n"
                          f"전략 MDD: {pct(swing['mdd'])}\n"
                          f"전략 Sharpe: {num(swing['sharpe_ratio'])}\n"
                          f"전략 거래 수: {int(swing['trades'])}\n"
                          f"QQQ B&H 수익률: {pct(hold['total_return'])}\n"
                          f"QQQ B&H CAGR: {pct(hold['cagr'])}\n"
                          f"QQQ B&H MDD: {pct(hold['mdd'])}\n"
                          "주의: 수정주가 기반, 고정환율 가정, 실거래 아님\n"
                      )
              except (FileNotFoundError, ValueError, KeyError, TypeError,
                      json.JSONDecodeError, OSError) as exc:
                  message += f"성과 요약 파일 조회 실패 ({type(exc).__name__}); GitHub 결과 확인\n"
          else:
              message += "성과: 백테스트 미완료 — 수익률 보고 생략\n"

          message += f"로그 및 결과: {os.environ.get('RUN_URL', '')}"
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=json.dumps({"chat_id": chat_id, "text": message}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if not json.load(response).get("ok"):
                      raise SystemExit("Telegram did not confirm delivery")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Telegram API returned HTTP {exc.code}") from None
          print("Telegram notification delivered")
          PY
