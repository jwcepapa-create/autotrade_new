name: Independent strategy research tests
on:
  push:
    branches:
      - research/support-resistance
      - research/momentum-variants
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  independent-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run regression tests
        run: python -m pytest -q
